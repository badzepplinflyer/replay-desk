name: Release

# Bump __version__ in rd/version.py (and add notes to CHANGELOG.md), push to main
# -> builds ReplayDesk-Setup.exe and publishes GitHub Release v<version>.
# Installed apps check the latest release and offer the update.
on:
  push:
    branches: [main]
    paths: ["rd/version.py", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(python tools/release_notes.py --version)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$v already released - nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Building v$v"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build installer
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: ./tools/build.ps1 -Version $env:VERSION

      - name: Release notes
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: python tools/release_notes.py $env:VERSION | Out-File -FilePath notes.md -Encoding utf8

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Replay Desk ${{ env.VERSION }}
          body_path: notes.md
          files: dist/ReplayDesk-Setup.exe
          make_latest: true
